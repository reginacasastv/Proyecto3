<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Tipo de Cambio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
      background: #fdeef3;
      margin: 0;
      padding: 40px 20px;
      color: #5a3142;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: #fff9fb;
      padding: 35px;
      border-radius: 14px;
      border: 1px solid #f6cbd9;
      box-shadow: 0 8px 25px rgba(210, 115, 150, 0.14);
    }

    h2 {
      text-align: center;
      color: #b84a76;
      margin-bottom: 10px;
    }

    .descripcion {
      text-align: center;
      color: #9e6b80;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: bold;
      color: #7c3f58;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #f2bfd0;
      border-radius: 22px;
      background: #ffffff;
      color: #5a3142;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      margin-bottom: 22px;
    }

    input:focus {
      border-color: #e27da3;
      box-shadow: 0 0 0 3px #fce1ea;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    #btnRegistrar {
      background: #e882a8;
      color: #fff;
    }

    #btnRegistrar:hover {
      background: #d86b94;
    }

    #btnConsultar {
      background: #fad4e2;
      color: #8f365a;
    }

    #btnConsultar:hover {
      background: #f5bdd2;
    }

    #estado {
      text-align: center;
      font-size: 14px;
      color: #a83c67;
      margin-top: 18px;
    }

    #seccionTabla {
      display: none;
      max-width: 800px;
      margin: 30px auto;
      padding: 25px;
      background: #fff9fb;
      border-radius: 14px;
      border: 1px solid #f6cbd9;
      box-shadow: 0 8px 25px rgba(210, 115, 150, 0.12);
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 13px;
      text-align: center;
      border-bottom: 1px solid #f7dce5;
    }

    th {
      background: #fadbe6;
      color: #822e50;
    }

    tr:hover {
      background: #fff0f5;
    }

    #btnCerrar {
      background: #f7c8d8;
      color: #8c2d52;
    }

    #btnCerrar:hover {
      background: #f2b2c8;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h2>Registro de Tipo de Cambio</h2>

    <p class="descripcion">
      Ingresa los datos para guardar un nuevo registro.
    </p>

    <form id="formulario">

      <label for="dia">Día:</label>
      <input
        type="number"
        id="dia"
        placeholder="Ingresa el día"
        min="1"
        max="31"
        step="1"
        required
      >

      <label for="tipoCambio">Tipo de cambio:</label>
      <input
        type="number"
        id="tipoCambio"
        placeholder="Ingresa el tipo de cambio"
        min="0"
        step="any"
        required
      >

      <button type="button" id="btnRegistrar">
        Registrar datos
      </button>

      <button type="button" id="btnConsultar">
        Consultar registros
      </button>

    </form>

    <p id="estado"></p>

  </div>

  <div id="seccionTabla">

    <h2>Registros guardados</h2>

    <button type="button" id="btnCerrar">
      Cerrar tabla
    </button>

    <div class="tabla-contenedor">
      <table>

        <thead>
          <tr>
            <th>Fecha de registro</th>
            <th>Día</th>
            <th>Tipo de cambio</th>
          </tr>
        </thead>

        <tbody id="tabla"></tbody>

      </table>
    </div>

  </div>

  <script>

    // Coloca aquí tu URL de Google Apps Script
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzJHXj4NZIf_EC3eVeni8I__zO0FHNEXwa08KX4LN4Zasv7MeDjVY6SZY2RtZOPGJTjQg/exec";

    var registros = [];

    // ---------- ENVIAR DATOS ----------

    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function(r) {
        return r.json();
      });
    }

    // ---------- REGISTRAR ----------

    document.getElementById("btnRegistrar").onclick = function() {

      var formulario = document.getElementById("formulario");

      if (!formulario.reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando datos...";

      enviar({
        accion: "guardar",
        dia: document.getElementById("dia").value,
        tipoCambio: document.getElementById("tipoCambio").value
      })
      .then(function(respuesta) {

        if (respuesta.ok) {
          document.getElementById("estado").textContent =
            "¡Datos registrados correctamente!";

          formulario.reset();

        } else {
          document.getElementById("estado").textContent =
            "Error: " + respuesta.mensaje;
        }

      })
      .catch(function() {
        document.getElementById("estado").textContent =
          "No se pudieron guardar los datos.";
      });

    };

    // ---------- CONSULTAR ----------

    document.getElementById("btnConsultar").onclick = function() {

      document.getElementById("estado").textContent = "Consultando...";

      document.getElementById("seccionTabla").style.display = "block";

      fetch(URL_SCRIPT)
        .then(function(r) {
          return r.json();
        })
        .then(function(datos) {

          registros = datos;
          mostrarTabla();

          document.getElementById("estado").textContent = "";

        })
        .catch(function() {

          document.getElementById("estado").textContent =
            "Error al consultar los registros.";

        });

    };

    // ---------- MOSTRAR TABLA ----------

    function mostrarTabla() {

      var tabla = document.getElementById("tabla");

      tabla.innerHTML = "";

      registros.forEach(function(reg) {

        var fila = document.createElement("tr");

        agregarCelda(fila, new Date(reg.fecha).toLocaleString());
        agregarCelda(fila, reg.dia);
        agregarCelda(fila, reg.tipoCambio);

        tabla.appendChild(fila);

      });

    }

    function agregarCelda(fila, texto) {

      var celda = document.createElement("td");

      celda.textContent = texto;

      fila.appendChild(celda);

    }

    // ---------- CERRAR TABLA ----------

    document.getElementById("btnCerrar").onclick = function() {

      document.getElementById("seccionTabla").style.display = "none";

    };

  </script>

</body>
</html>
